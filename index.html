<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060208">
<title>Love Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #060208; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  // ---- Settings ---------------------------------------------------------
  const DURATION = 10000;        // ms the whole heart takes to appear
  const START_DELAY = 200;       // ms before the first phrase
  const ANIM_MS = 42 * 16;       // ms one phrase takes to float in
  const LIFT = 34;               // px a phrase floats down from
  const GAP = 7;                 // px between phrases in a row
  const SIZES_PT = [9, 10, 11, 12];
  const BG = "#060208";
  const FLASH = [1.0, 0.78, 0.78];
  const SIGNATURE = "Abdullayevdan";   // small stamp in the bottom-right corner ("" to hide)
  const FAMILY = '"Segoe UI", system-ui, -apple-system, "Noto Sans", Arial, sans-serif';

  const PHRASES = [
    "I love you",               // English
    "Seni seviyorum",           // Turkish
    "Seni sevaman",             // Uzbek
    "Te amo",                   // Spanish
    "Je t'aime",                // French
    "Ich liebe dich",           // German
    "Ti amo",                   // Italian
    "Eu te amo",                // Portuguese
    "Я тебя люблю",             // Russian
    "사랑해",                    // Korean
    "愛してる",                  // Japanese
    "我爱你",                    // Chinese
    "मैं तुमसे प्यार करता हूँ",   // Hindi
    "Σ' αγαπώ",                 // Greek
    "Ik hou van jou",           // Dutch
    "Jag älskar dig",           // Swedish
    "Kocham cię",               // Polish
    "ฉันรักเธอ",                 // Thai
    "Anh yêu em",               // Vietnamese
    "Aku cinta kamu",           // Indonesian
    "Я тебе кохаю"              // Ukrainian
  ];

  // ---- Helpers ----------------------------------------------------------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const BGC = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16) / 255);

  const clamp = v => Math.max(0, Math.min(1, v));
  const mix = (a, b, k) => a.map((p, i) => p + (b[i] - p) * k);
  const dim = (c, k) => c.map(v => v * k);
  const css = c => "rgb(" + c.map(v => Math.round(clamp(v) * 255)).join(",") + ")";
  const pulse = v => Math.sin(Math.PI * v);

  function mulberry32(seed) {
    let a = seed;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Heart geometry (unit coordinates, y up) ---------------------------
  const UNIT = [];
  for (let i = 0; i < 720; i++) {
    const a = 2 * Math.PI * i / 720;
    UNIT.push([
      16 * Math.sin(a) ** 3,
      13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)
    ]);
  }
  const UMAX = Math.max(...UNIT.map(p => p[1]));
  const UMIN = Math.min(...UNIT.map(p => p[1]));

  // ---- State -------------------------------------------------------------
  let W = 0, H = 0, F = 1;
  let items = [], totalEnd = 0, t0 = 0, lastRender = 0, nextShimmer = 0, raf = 0;

  function layout() {
    const rng = mulberry32(11);
    const uniform = (a, b) => a + rng() * (b - a);
    const choice = arr => arr[Math.floor(rng() * arr.length)];

    const margin = Math.max(10, Math.min(W, H) * 0.03);
    const SC = Math.min((W - 2 * margin) / 32, (H - 2 * margin) / (UMAX - UMIN));
    F = Math.max(0.75, Math.min(1.7, SC / 21));

    const POLY = UNIT.map(([x, y]) => [x * SC, y * SC]);
    const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
    const YMAX = UMAX * SC, YMIN = UMIN * SC;
    const CY = (YMAX + YMIN) / 2;
    const originY = H / 2 + CY;

    function spans(y) {
      const xs = [];
      for (const [[x1, y1], [x2, y2]] of EDGES) {
        if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
          xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
        }
      }
      xs.sort((a, b) => a - b);
      const out = [];
      for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
      return out;
    }

    function intersect(A, B) {
      const out = [];
      for (const a of A) for (const b of B) {
        const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
        if (hi - lo > 14 * F) out.push([lo, hi]);
      }
      return out;
    }

    function* phraseCycle() {
      while (true) {
        const order = PHRASES.slice();
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        yield* order;
      }
    }

    const sizes = SIZES_PT.map(pt => pt * 4 / 3 * F);
    const measure = (text, size) => {
      ctx.font = "bold " + size + "px " + FAMILY;
      return ctx.measureText(text).width;
    };

    const cycle = phraseCycle();
    const rowH = Math.max(...sizes) * 1.3 + 4;
    const half = rowH / 2;
    const placed = [];

    for (let y = YMAX - half; y > YMIN + half; y -= rowH) {
      const row = intersect(spans(y + half), spans(y - half));

      for (const [lo0, hi0] of row) {
        const lo = lo0 + 4, hi = hi0 - 4;
        let cur = lo + uniform(0, 8);
        const line = [];

        for (;;) {
          let fit = null;
          for (let k = 0; k < 10; k++) {
            const text = cycle.next().value;
            const size = choice(sizes);
            const w = measure(text, size);
            if (cur + w <= hi) { fit = { text, size, w }; break; }
          }
          if (!fit) break;
          line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
          cur += fit.w + GAP * F;
        }

        if (!line.length) continue;

        if (line.length > 1) {
          const last = line[line.length - 1];
          const left = hi - (last.x + last.w / 2);
          line.forEach((it, i) => { it.x += left * i / (line.length - 1); });
        } else {
          line[0].x = (lo + hi) / 2;
        }

        line.forEach((it, i) => {
          placed.push({
            x: it.x, y, text: it.text, size: it.size,
            edge: i === 0 || i === line.length - 1
          });
        });
      }
    }

    const wine = [0.58, 0.0, 0.09];
    const crimson = [0.90, 0.05, 0.14];
    const blood = [0.98, 0.10, 0.16];
    for (const p of placed) {
      const rx = p.x / (16 * SC), ry = (p.y - CY) / (14.5 * SC);
      p.rad = Math.min(1, Math.hypot(rx, ry));
      let base = mix(wine, crimson, 0.25 + 0.75 * p.rad);
      base = mix(base, blood, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
      p.color = base.map(v => Math.min(1, v));
    }

    const TWO_PI = 2 * Math.PI;
    const angle = p => (((Math.atan2(p.x, p.y - CY)) % TWO_PI) + TWO_PI) % TWO_PI;
    const edges = placed.filter(p => p.edge);
    const inner = placed.filter(p => !p.edge);
    edges.forEach(p => { p.key = angle(p); });
    inner.forEach(p => { p.key = -p.rad + uniform(0, 0.08); });
    edges.sort((a, b) => a.key - b.key);
    inner.sort((a, b) => a.key - b.key);
    const order = edges.concat(inner);

    const step = DURATION / order.length;
    items = order.map((p, i) => ({
      sx: W / 2 + p.x,
      sy: originY - p.y,
      text: p.text,
      font: "bold " + p.size + "px " + FAMILY,
      fontBig: "bold " + (p.size + 1) + "px " + FAMILY,
      color: p.color,
      dx: uniform(-10, 10) * F,
      start: START_DELAY + i * step,
      flashEnd: 0
    }));
    totalEnd = START_DELAY + (order.length - 1) * step + ANIM_MS;
  }

  // ---- Drawing -----------------------------------------------------------
  function drawItem(p, now) {
    const age = now - p.start;
    if (age < 0) return;

    const u = clamp(age / ANIM_MS);
    const e = 1 - (1 - u) ** 3;                  // cubic ease-out
    const c = p.color;
    const px = p.sx + p.dx * (1 - e);
    const py = p.sy - (1 - e) * LIFT * F;

    ctx.font = p.font;
    ctx.fillStyle = css(mix(BGC, dim(c, 0.30), e));
    ctx.fillText(p.text, p.sx + 2, p.sy + 3);    // shadow

    ctx.font = p.fontBig;
    ctx.fillStyle = css(mix(BGC, dim(c, 0.20), e * e));
    ctx.fillText(p.text, px, py);                // halo

    let col;
    if (u >= 1) {
      col = c;
    } else {
      const flash = 0.75 * pulse(clamp((u - 0.55) / 0.45));
      col = mix(mix(BGC, c, e ** 1.5), FLASH, flash);
    }
    if (p.flashEnd > now) col = mix(c, FLASH, 0.6);   // idle shimmer

    ctx.font = p.font;
    ctx.fillStyle = css(col);
    ctx.fillText(p.text, px, py);
  }

  function render(now) {
    lastRender = now;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of items) drawItem(p, now);

    if (SIGNATURE) {
      ctx.font = "italic 12px " + FAMILY;
      ctx.fillStyle = "rgba(255, 205, 210, 0.45)";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText(SIGNATURE, W - 14, H - 14);
    }
  }

  function frame(ts) {
    const now = ts - t0;
    if (now < totalEnd) {
      render(now);
    } else if (now - lastRender >= 70) {
      if (now >= nextShimmer) {
        items[Math.floor(Math.random() * items.length)].flashEnd = now + 260;
        nextShimmer = now + 140;
      }
      render(now);
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    cancelAnimationFrame(raf);
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    layout();
    nextShimmer = 0;
    lastRender = 0;
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }

  // Restart (re-layout) when the window size or phone orientation changes
  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (window.innerWidth !== W || window.innerHeight !== H) start();
    }, 250);
  });

  start();
})();
</script>
</body>
</html>
